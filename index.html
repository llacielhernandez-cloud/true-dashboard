<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T.R.U.E. Technician Overview</title>
<style>
  /* T.R.U.E. theme: black and red. One theme (brand), dark by design. */
  :root {
    color-scheme: dark;
    --page: #0a0a0b;
    --card: #18181b;
    --card-2: #1b1b1e;
    --ink: #f4f2ef; --ink-2: #c3c0ba; --muted: #8c8a86;
    --line: rgba(255,255,255,0.07); --grid: #2a2a2d; --axis: #3a3a3e;
    --red: #e5383b; --amber: #c98500; --blue: #3987e5;
    --team: #3dd6c6;
    --good: #2fbf4a; --bad: #ff7a7a;
    --grad: linear-gradient(160deg, #0a0a0b 0%, #3a040b 55%, #c8102e 100%);
    --grad-red: linear-gradient(90deg, #8f0d1a, #e5383b);
    --shadow: 0 10px 30px rgba(0,0,0,0.45);
    /* Elevation: a lit top edge plus three stacked, offset shadows so panels sit above the page. */
    --lift: inset 0 1px 0 rgba(255,255,255,0.08), 0 1px 2px rgba(0,0,0,0.6), 0 8px 16px -4px rgba(0,0,0,0.55), 0 26px 50px -14px rgba(0,0,0,0.8);
    --lift-hover: inset 0 1px 0 rgba(255,255,255,0.12), 0 2px 4px rgba(0,0,0,0.6), 0 18px 30px -8px rgba(0,0,0,0.65), 0 40px 70px -16px rgba(0,0,0,0.85);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--page); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
    background: radial-gradient(900px 500px at 100% -10%, rgba(200,16,46,0.22), transparent 60%),
                radial-gradient(700px 500px at -10% 110%, rgba(200,16,46,0.12), transparent 60%); }
  .app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }

  /* Sidebar */
  .side { background: var(--grad); padding: 26px 20px; position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; gap: 26px; border-right: 1px solid rgba(255,255,255,0.06); }
  .brand .logo { display: block; width: 100%; max-width: 196px; height: auto; }
  .brand small { display: block; font-weight: 700; font-size: 11px; letter-spacing: 0.2em; color: #ffb3b8; margin-top: 8px; }
  .badge { display: block; width: 100px; height: auto; margin: 0 auto 10px; }
  .values { margin-top: auto; padding: 14px; border-radius: 14px; background: rgba(12,4,6,0.55);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.45), 0 18px 36px -12px rgba(0,0,0,0.7); }
  .values div { font-size: 13px; color: #f4e9ea; padding: 3px 0; }
  .values b { font-size: 20px; font-weight: 900; font-style: italic; color: #ff3b3b; line-height: 1.1; }

  /* Main */
  main { padding: 26px 28px 56px; min-width: 0; }
  .top { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; }
  .hello .kicker { font-size: 12px; color: var(--ink-2); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; }
  .hello h1 { margin: 2px 0 2px; font-size: 30px; letter-spacing: -0.01em; }
  .hello .sub { color: var(--ink-2); font-size: 13px; }
  .env { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--red); color: #fff; margin-left: 10px; vertical-align: middle; letter-spacing: .04em; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .filters label { display: flex; flex-direction: column; gap: 5px; font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  select, input[type=date], input[type=search] { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--card);
    border: 1px solid var(--axis); border-radius: 12px; padding: 8px 12px; min-height: 38px; }
  select:focus, input:focus { outline: 2px solid var(--red); outline-offset: 1px; }
  select#tech { min-width: 220px; }
  .custom { display: none; gap: 10px; } .custom.on { display: flex; }

  .grid { display: grid; gap: 18px; margin-top: 18px; }
  .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .card.tight { padding: 18px 14px; }
  .charts { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
  .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .card { background: var(--card); border: 0; border-radius: 16px; padding: 18px 20px; min-width: 0; box-shadow: var(--lift);
    transition: transform .28s var(--ease), box-shadow .28s var(--ease); }
  @media (hover: hover) {
    .tiles .card:hover, .charts .card:hover { transform: translateY(-4px); box-shadow: var(--lift-hover); }
  }
  .card h2 { font-size: 15px; margin: 0; font-weight: 650; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .pill { font-size: 11.5px; color: var(--ink-2); border: 1px solid var(--axis); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }

  .tile { position: relative; overflow: hidden; }
  .tile .label { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
  .tile .value { font-size: 30px; font-weight: 750; margin: 4px 0 2px; letter-spacing: -0.01em; }
  .tile .cmp { font-size: 12px; color: var(--muted); }
  .tile .chip { display: inline-block; font-size: 12px; font-weight: 700; margin-top: 8px; }
  .tile .spark { position: absolute; right: 14px; top: 16px; width: 42%; height: 42px; }
  .tile.hero { background: linear-gradient(135deg, #3a040b 0%, #8f0d1a 60%, #e5383b 130%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 1px 2px rgba(0,0,0,0.6), 0 10px 20px -6px rgba(0,0,0,0.6), 0 26px 50px -14px rgba(0,0,0,0.8); }
  .tile.hero .label, .tile.hero .cmp { color: #ffd9dc; }
  .tile.hero .up { color: #7dff95; } .tile.hero .down { color: #ffd0d0; }
  .up { color: var(--good); } .down { color: var(--bad); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; position: sticky; top: 0; background: var(--card); z-index: 1; }
  th:first-child, td:first-child, th.l, td.l { text-align: left; }
  tr.strong td { font-weight: 700; }
  tbody tr:hover td { background: rgba(255,255,255,0.025); }
  .scroll { overflow: auto; max-height: 660px; }
  .rank tbody tr { cursor: pointer; }
  .rank tr.me td { background: rgba(229,56,59,0.16); font-weight: 700; }
  .rank tr.me td:first-child { box-shadow: inset 3px 0 0 var(--red); }
  .medal { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: 800; background: var(--card-2); color: var(--ink-2); }
  .medal.g { background: var(--grad-red); color: #fff; }
  .medal.m1 { background: linear-gradient(160deg, #ffe08a, #d9a21b); color: #2a1a00; }
  .medal.m2 { background: linear-gradient(160deg, #f1f3f5, #a7adb4); color: #1b1d20; }
  .medal.m3 { background: linear-gradient(160deg, #f0b07a, #b06a2c); color: #2a1200; }
  .sbar { display: inline-block; height: 8px; border-radius: 0 4px 4px 0; background: var(--grad-red); vertical-align: middle; margin-right: 8px; transform-origin: left; animation: mm-grow-x .5s var(--ease) both; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); }
  .key { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
  .key.line { height: 0; border-radius: 0; vertical-align: middle; border-top: 2px dashed var(--team); background: none; }
  .key.above { background: linear-gradient(180deg, #ff8a3d, #c4141f); } .key.below { background: linear-gradient(180deg, #a3242c, #4a070e); }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: 260px; }
  .tip { position: absolute; pointer-events: none; background: #0f0f10; border: 1px solid var(--axis);
    box-shadow: var(--shadow); border-radius: 10px; padding: 8px 12px; font-size: 12px; display: none; white-space: nowrap; z-index: 2; }
  .donut { display: grid; place-items: center; position: relative; }
  .donut svg { width: 180px; height: 180px; }
  .donut .mid { position: absolute; text-align: center; }
  .donut .mid b { display: block; font-size: 26px; }
  .donut .mid span { font-size: 11.5px; color: var(--muted); }
  .mix { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; text-align: center; }
  .mix b { display: block; font-size: 18px; }
  .mix span { font-size: 12px; color: var(--ink-2); }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .status { padding: 50px 0; text-align: center; color: var(--ink-2); }
  .err { color: var(--bad); }
  button.more { font: inherit; margin-top: 10px; padding: 7px 14px; border-radius: 10px; border: 1px solid var(--axis); background: var(--card-2); color: var(--ink); cursor: pointer; }
  button.more:hover { border-color: var(--red); }
  .loading { opacity: .5; transition: opacity .15s; }
  section { scroll-margin-top: 16px; }

  /* Brand motion: the logo drives in (clip + blur), then a light sweep crosses only the painted letters.
     The T.R.U.E. badge follows, and its four initials light up in order. Content stays visible without JS. */
  .shine { position: relative; display: block; }
  .shine::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 38%, rgba(255,240,230,0.95) 48%, rgba(255,120,110,0.6) 52%, transparent 62%) no-repeat;
    background-size: 260% 100%; background-position: 160% 0;
    -webkit-mask: var(--m) center / 100% 100% no-repeat; mask: var(--m) center / 100% 100% no-repeat;
    mix-blend-mode: screen; opacity: 0; }
  .shine.ready::after { opacity: 1; animation: mm-sweep 9s cubic-bezier(0.45, 0, 0.25, 1) .75s infinite; }
  .badge-shine { width: 100px; margin: 0 auto 10px; } .badge-shine .badge { margin: 0; }
  .badge-shine.ready::after { animation-delay: 1.3s; }
  .logo-shine .logo { animation: mm-drive .8s var(--ease) both; }
  .badge-shine .badge { animation: mm-drive .7s var(--ease) .35s both; }
  .values b { display: inline-block; animation: mm-lamp 1.6s ease-out both; }
  .values div:nth-of-type(1) b { animation-delay: 1.0s; } .values div:nth-of-type(2) b { animation-delay: 1.15s; }
  .values div:nth-of-type(3) b { animation-delay: 1.3s; } .values div:nth-of-type(4) b { animation-delay: 1.45s; }
  .side.paused .shine::after { animation-play-state: paused; }
  @keyframes mm-drive { from { clip-path: inset(0 100% 0 0); filter: blur(6px); transform: translateX(-14px); } to { clip-path: inset(0 0 0 0); filter: blur(0); transform: none; } }
  @keyframes mm-sweep { 0% { background-position: 160% 0; } 16%, 100% { background-position: -60% 0; } }
  @keyframes mm-lamp { 0% { color: #ff3b3b; text-shadow: none; transform: none; }
    25% { color: #fff3ea; text-shadow: 0 0 6px rgba(255,90,80,0.9), 0 0 18px rgba(255,40,40,0.7); transform: translateY(-1px) scale(1.12); }
    100% { color: #ff3b3b; text-shadow: none; transform: none; } }
  @keyframes mm-grow-x { from { transform: scaleX(0); } }
  @keyframes mm-grow-y { from { transform: scaleY(0); } }
  @keyframes mm-draw { from { stroke-dasharray: 0 1000; } }
  @keyframes mm-fade { from { opacity: 0; } }
  .chart .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: mm-grow-y .55s var(--ease) both; }
  .chart .teamline { animation: mm-fade .5s ease .25s both; }
  .donut .seg { animation: mm-draw .8s var(--ease) both; }
  @media (prefers-reduced-motion: reduce) {
    .logo-shine .logo, .badge-shine .badge { animation: mm-fade .4s ease both; }
    .shine.ready::after { animation: none; opacity: 0; }
    .values b { animation: none; }
    .chart .bar, .sbar, .donut .seg { animation: mm-fade .3s ease both; }
    .card { transition: box-shadow .2s ease; }
    .tiles .card:hover, .charts .card:hover { transform: none; }
  }

  @media (max-width: 1100px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .charts, .two { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .side { position: static; height: auto; flex-direction: row; align-items: center; justify-content: space-between; padding: 16px; gap: 12px; }
    .values { margin: 0; padding: 8px 10px; display: flex; gap: 8px; }
    .values div { font-size: 0; padding: 0; } .values b { width: auto; font-size: 18px; } .values .badge { width: 52px; margin: 0 4px 0 0; } .values .badge-shine { width: 52px; margin: 0 4px 0 0; flex: none; } .values .badge-shine .badge { width: 100%; margin: 0; } .values { align-items: center; } .brand .logo { max-width: 150px; }
    main { padding: 18px 16px 40px; }
    .hello h1 { font-size: 24px; }
    .filters { width: 100%; }
    .filters label { flex: 1 1 140px; } select#tech { min-width: 0; width: 100%; } select { width: 100%; }
    .tile .value { font-size: 24px; } .tile .spark { display: none; }
    td:first-child { white-space: normal; min-width: 120px; }
  }
</style>

<style>
  #lock { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px;
    background: var(--page); }
  #lock::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(900px 500px at 100% -10%, rgba(200,16,46,0.28), transparent 60%),
                radial-gradient(700px 500px at -10% 110%, rgba(200,16,46,0.16), transparent 60%); }
  #lock[hidden] { display: none; }
  #lock form { position: relative; width: min(380px, 100%); display: grid; gap: 14px; padding: 28px 26px; }
  #lock img { width: 180px; height: auto; margin-bottom: 4px; }
  #lock h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  #lock p { margin: 0; color: var(--ink-2); font-size: 13px; }
  #lock input[type=password] { font: inherit; font-size: 15px; color: var(--ink); background: var(--page); border: 1px solid var(--axis);
    border-radius: 12px; padding: 10px 12px; min-height: 44px; width: 100%; }
  #lock input[type=password]:focus { outline: 2px solid var(--red); outline-offset: 1px; }
  #lock label.rem { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); }
  #lock label.rem input { accent-color: var(--red); width: 16px; height: 16px; }
  #lock button { font: inherit; font-weight: 700; font-size: 14px; min-height: 44px; border: 0; border-radius: 12px; cursor: pointer;
    color: #fff; background: linear-gradient(180deg, #e5383b, #a50f1d); box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 6px 14px -6px rgba(0,0,0,0.7); }
  #lock button:disabled { opacity: .6; cursor: progress; }
  #lock button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #lock .msg { min-height: 18px; font-size: 13px; color: var(--ink-2); }
  #lock .msg.err { color: var(--bad); }
  button.lockbtn { font: inherit; font-size: 12.5px; align-self: flex-end; min-height: 38px; padding: 0 14px; border-radius: 12px;
    border: 1px solid var(--axis); background: var(--card); color: var(--ink-2); cursor: pointer; }
  button.lockbtn:hover { color: var(--ink); border-color: var(--red); }
</style>

<script>
/* GitHub Pages data layer: replaces google.script.run. Generated by github-pages/build.py. */
(function () {
  var MM_WEB = { PERIODS: ['Latest Imported Day', 'This Week', 'Last Week', 'This Month', 'Last Month',
    'This Year', 'Last Year', 'All Time', 'Custom Range'], MAX_LIST: 3000 };
  var MM = { HIVE: { START_DATE: '2025-01-01' } };
function mmOvSerial_(iso) {
  const p = iso.split('-').map(Number);
  return Date.UTC(p[0], p[1] - 1, p[2]) / 86400000 + 25569;
}

function mmWebIso_(serial) {
  const d = new Date((serial - 25569) * 86400000);
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
}

function mmWebLowerBound_(arr, x) {
  let lo = 0, hi = arr.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m] < x) lo = m + 1; else hi = m; }
  return lo;
}

function mmWebPeriod_(period, from, to, latest, todayIso) {
  const ser = iso => mmOvSerial_(iso);
  const t = ser(todayIso);
  const last = latest || t;
  const d = new Date((t - 25569) * 86400000);
  const y = d.getUTCFullYear(), m = d.getUTCMonth();
  const ymd = (yy, mm, dd) => Date.UTC(yy, mm, dd) / 86400000 + 25569;
  const mon = t - (t + 5) % 7;   // Monday of this week (serial 0 = Saturday)
  const valid = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
  switch (period) {
    case 'This Week': return { start: mon, end: mon + 6 };
    case 'Last Week': return { start: mon - 7, end: mon - 1 };
    case 'This Month': return { start: ymd(y, m, 1), end: ymd(y, m + 1, 0) };
    case 'Last Month': return { start: ymd(y, m - 1, 1), end: ymd(y, m, 0) };
    case 'This Year': return { start: ymd(y, 0, 1), end: ymd(y, 11, 31) };
    case 'Last Year': return { start: ymd(y - 1, 0, 1), end: ymd(y - 1, 11, 31) };
    case 'All Time': return { start: ser(MM.HIVE.START_DATE), end: Math.max(t, last) };
    case 'Custom Range': {
      let s = valid(from) ? ser(from) : last, e = valid(to) ? ser(to) : last;
      if (e < s) { const x = s; s = e; e = x; }
      return { start: s, end: e };
    }
    default: return { start: last, end: last };   // Latest Imported Day
  }
}

function mmWebAggregate_(rows, tech, groups, countMode, addonPoints) {
  const C = { tech: 0, date: 1, id: 2, veh: 3, grp: 4, scan: 5, a1: 6, a2: 7, a3: 8, prog: 9, sws: 10, sas: 11,
    asl: 12, diag: 13, kpi: 14, price: 15, inv: 16, nb: 17, bill: 18, dir: 19 };
  const num = v => Number(v) || 0;
  const blank = () => ({ sessions: 0, invoiced: 0, notBillable: 0, adas1: 0, adas2: 0, adas3: 0, programming: 0,
    sws: 0, sas: 0, asl: 0, diag: 0, kpi: 0, price: 0, days: new Set() });
  const add = (a, r) => {
    const b = num(r[C.bill]);
    a.sessions++; a.invoiced += num(r[C.inv]); a.notBillable += num(r[C.nb]);
    a.adas1 += num(r[C.a1]); a.adas2 += num(r[C.a2]); a.adas3 += num(r[C.a3]);
    if (b) { a.programming += num(r[C.prog]); a.sws += num(r[C.sws]); a.sas += num(r[C.sas]); a.asl += num(r[C.asl]); a.diag += num(r[C.diag]); }
    a.kpi += num(r[C.kpi]); a.price += num(r[C.price]);
  };
  const me = blank(), team = blank(), per = {};
  const gi = {}; groups.forEach((g, i) => { gi[g] = i; });
  const share = groups.map(g => ({ group: g, mine: 0, available: 0, pre: 0, post: 0, ivs: 0, team: 0 }));
  const daily = {};
  const list = [];
  rows.forEach(r => {
    const who = String(r[C.tech] || '');
    const day = num(r[C.date]);
    const g = share[gi[r[C.grp]] !== undefined ? gi[r[C.grp]] : groups.length - 1];
    const availOk = countMode === 'DIRECTORY' ? num(r[C.dir]) : countMode === 'INVOICED' ? num(r[C.bill]) : 1;
    const mineOk = countMode === 'INVOICED' ? num(r[C.inv]) : 1;
    if (availOk) g.available++;
    if (!who) return;
    add(team, r); team.days.add(who + '|' + day);
    if (mineOk) g.team++;
    if (!per[who]) per[who] = blank();
    add(per[who], r); per[who].days.add(day);
    const dd = daily[day] || (daily[day] = { mine: 0, mineN: 0, teamKpi: 0, techs: new Set() });
    dd.teamKpi += num(r[C.kpi]); dd.techs.add(who);
    if (who !== tech) return;
    add(me, r); me.days.add(day);
    dd.mine += num(r[C.kpi]); dd.mineN++;
    if (mineOk) g.mine++;
    if (r[C.scan] === 'Pre') g.pre++; else if (r[C.scan] === 'Post') g.post++; else if (r[C.scan] === 'IVS') g.ivs++;
    list.push(r);
  });
  const techs = Object.keys(per).length;
  const fin = (a, isTeam) => {
    const days = a.days.size;
    const o = { sessions: a.sessions, invoiced: a.invoiced, notBillable: a.notBillable, workDays: days,
      adas1: a.adas1, adas2: a.adas2, adas3: a.adas3, programming: a.programming, sws: a.sws, sas: a.sas,
      asl: a.asl, diag: a.diag, addlKpi: (a.sws + a.sas + a.asl + a.diag) * addonPoints, kpi: a.kpi, price: a.price,
      avgKpi: a.sessions ? a.kpi / a.sessions : null, avgPerDay: days ? a.price / days : null,
      avgPerSession: a.sessions ? a.price / a.sessions : null };
    if (!isTeam) return o;
    // Team: per active technician, except the ratios, which are team totals divided.
    const t = {};
    Object.keys(o).forEach(k => { t[k] = techs ? o[k] / techs : null; });
    t.avgKpi = o.avgKpi; t.avgPerDay = o.avgPerDay; t.avgPerSession = o.avgPerSession;
    return t;
  };
  const r2 = x => Math.round(x * 100) / 100;
  const ranking = Object.keys(per).map(k => {
    const a = per[k];
    return { tech: k, sessions: a.sessions, invoiced: a.invoiced, kpi: r2(a.kpi), price: r2(a.price),
      avgKpi: a.sessions ? a.kpi / a.sessions : null, workDays: a.days.size, avgPerDay: a.days.size ? a.price / a.days.size : null };
  }).sort((a, b) => b.kpi - a.kpi || b.sessions - a.sessions || a.tech.localeCompare(b.tech));
  share.forEach(s => { s.team = techs ? s.team / techs : null; s.share = s.available ? s.mine / s.available : null; });
  const trend = Object.keys(daily).map(Number).sort((a, b) => a - b).map(d => ({ date: mmWebIso_(d),
    mine: r2(daily[d].mine), sessions: daily[d].mineN, team: daily[d].techs.size ? daily[d].teamKpi / daily[d].techs.size : 0 }));
  list.sort((a, b) => num(b[C.date]) - num(a[C.date]) || String(b[C.id]).localeCompare(String(a[C.id])));
  return {
    me: fin(me, false), team: fin(team, true), techsActive: techs, share: share, ranking: ranking, trend: trend,
    sessionsTotal: list.length,
    sessions: list.slice(0, MM_WEB.MAX_LIST).map(r => ({ date: mmWebIso_(num(r[C.date])), id: String(r[C.id]), vehicle: String(r[C.veh]),
      scan: String(r[C.scan]), adas: num(r[C.a1]) + num(r[C.a2]) + num(r[C.a3]), kpi: num(r[C.kpi]), price: num(r[C.price]),
      status: num(r[C.inv]) ? 'Invoiced' : num(r[C.nb]) ? 'Not Billable' : 'Open' }))
  };
}

  var subtle = window.crypto && window.crypto.subtle;
  var te = function (s) { return new TextEncoder().encode(s); };
  var b64 = function (s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; };
  var tob64 = function (a) { var s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); };
  var HM = { name: 'HMAC', hash: 'SHA-256' };
  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del: function (k) { try { localStorage.removeItem(k); } catch (e) {} } };

  function dataUrl() {
    var q = new URLSearchParams(location.search);
    if (q.get('data')) return q.get('data');
    var m = location.hostname.match(/^([^.]+)\.github\.io$/i), repo = location.pathname.split('/').filter(Boolean)[0];
    if (!m || !repo) throw new Error('Open this page from its GitHub Pages address.');
    return 'https://raw.githubusercontent.com/' + m[1] + '/' + repo + '/data/overview.json';
  }

  async function derive(pw, env) {
    var base = await subtle.importKey('raw', te(pw), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await subtle.deriveBits({ name: 'PBKDF2', salt: b64(env.salt), iterations: env.iter, hash: 'SHA-256' }, base, 256));
  }

  async function open(key, env) {
    var k = await subtle.importKey('raw', key, HM, false, ['sign']);
    var enc = new Uint8Array(await subtle.sign('HMAC', k, te('enc'))), mac = new Uint8Array(await subtle.sign('HMAC', k, te('mac')));
    var nonce = b64(env.nonce), ct = b64(env.data), msg = new Uint8Array(nonce.length + ct.length);
    msg.set(nonce); msg.set(ct, nonce.length);
    var macKey = await subtle.importKey('raw', mac, HM, false, ['verify']);
    if (!(await subtle.verify('HMAC', macKey, b64(env.tag), msg))) return null;   // wrong password (or damaged file)
    var encKey = await subtle.importKey('raw', enc, HM, false, ['sign']);
    var out = new Uint8Array(ct.length), blocks = Math.ceil(ct.length / 32);
    for (var b0 = 0; b0 < blocks; b0 += 2048) {
      var ps = [];
      for (var b = b0; b < Math.min(blocks, b0 + 2048); b++) {
        var m = new Uint8Array(20); m.set(nonce); m[16] = b >>> 24 & 255; m[17] = b >>> 16 & 255; m[18] = b >>> 8 & 255; m[19] = b & 255;
        ps.push(subtle.sign('HMAC', encKey, m));
      }
      var ks = await Promise.all(ps);
      ks.forEach(function (buf, n) {
        var s = new Uint8Array(buf), i = (b0 + n) * 32;
        for (var j = 0; j < 32 && i + j < ct.length; j++) out[i + j] = ct[i + j] ^ s[j];
      });
    }
    var text = await new Response(new Blob([out]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    return JSON.parse(text);
  }

  var DB = null;
  function load(packed) {
    var d = packed.dict;
    MM.HIVE.START_DATE = packed.meta.start || MM.HIVE.START_DATE;
    var rows = packed.rows.map(function (r) {
      return [d.t[r[0]], r[1], r[2], d.v[r[3]], d.g[r[4]], d.s[r[5]]].concat(r.slice(6), ['']);
    });
    rows.sort(function (a, b) { return a[1] - b[1]; });
    DB = { meta: packed.meta, rows: rows, dates: rows.map(function (r) { return r[1]; }) };
  }

  function today() {
    try { return new Intl.DateTimeFormat('en-CA', { timeZone: DB.meta.tz || undefined, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
    catch (e) { var t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); }
  }

  var api = {
    mmWebInit: function () {
      var latest = DB.dates.length ? DB.dates[DB.dates.length - 1] : 0;
      return { techs: DB.meta.techs, periods: MM_WEB.PERIODS, latest: latest ? mmWebIso_(latest) : '', env: DB.meta.env, builtAt: DB.meta.builtAt };
    },
    mmWebReport: function (tech, period, from, to) {
      var latest = DB.dates.length ? DB.dates[DB.dates.length - 1] : 0;
      var p = mmWebPeriod_(period, from, to, latest, today());
      var lo = mmWebLowerBound_(DB.dates, p.start), hi = mmWebLowerBound_(DB.dates, p.end + 1);
      var out = mmWebAggregate_(DB.rows.slice(lo, hi), tech, DB.meta.groups, DB.meta.countMode, DB.meta.addon);
      out.period = { name: period, start: mmWebIso_(p.start), end: mmWebIso_(p.end), latest: latest ? mmWebIso_(latest) : '' };
      out.tech = tech;
      return out;
    }
  };

  var resolveReady, rejectReady;
  var ready = new Promise(function (res, rej) { resolveReady = res; rejectReady = rej; });
  function runner() {
    var ok = function () {}, fail = function () {}, r = {
      withSuccessHandler: function (f) { ok = f; return r; }, withFailureHandler: function (f) { fail = f; return r; } };
    Object.keys(api).forEach(function (name) {
      r[name] = function () {
        var args = arguments;
        ready.then(function () { try { ok(api[name].apply(null, args)); } catch (e) { fail(e); } }, fail);
      };
    });
    return r;
  }
  window.google = { script: { get run() { return runner(); } } };

  function $(id) { return document.getElementById(id); }
  function msg(t, err) { $('lockMsg').textContent = t; $('lockMsg').classList.toggle('err', !!err); }
  function unlocked(packed) {
    load(packed);
    $('lock').hidden = true;
    var b = document.createElement('button'); b.type = 'button'; b.className = 'lockbtn'; b.textContent = 'Lock';
    b.title = 'Lock the dashboard and forget the password on this device';
    b.onclick = function () { store.del('mmgh.key'); location.reload(); };
    var f = document.querySelector('.filters'); if (f) f.appendChild(b);
    resolveReady();
  }

  document.addEventListener('DOMContentLoaded', function () {
    var logo = document.querySelector('.brand .logo'); if (logo) $('lockLogo').src = logo.src;
    var env = null, busy = false;
    if (!subtle || !window.DecompressionStream) { msg('This browser is too old for the dashboard. Use a current Chrome, Edge, Safari or Firefox.', true); return; }
    var url; try { url = dataUrl(); } catch (e) { msg(e.message, true); return; }
    fetch(url + (url.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status === 404 ? 'No dashboard data has been published yet.' : 'Could not load the data (' + r.status + ').'); return r.json(); })
      .then(async function (e) {
        if (!e || e.v !== 'MMENC1') throw new Error('The data file is not in the expected format.');
        env = e;
        var saved = store.get('mmgh.key');
        if (saved && saved.split('|')[1] === env.salt) {
          msg('Unlocking…');
          var data = await open(b64(saved.split('|')[0]), env);
          if (data) return unlocked(data);
          store.del('mmgh.key');
        }
        msg('');
        $('pw').focus();
      })
      .catch(function (e) { msg(e.message || String(e), true); rejectReady(e); });

    $('lockForm').addEventListener('submit', async function (ev) {
      ev.preventDefault();
      if (!env || busy) return;
      var pw = $('pw').value; if (!pw) { msg('Enter the password.', true); return; }
      busy = true; $('unlockBtn').disabled = true; msg('Unlocking…');
      try {
        var key = await derive(pw, env), data = await open(key, env);
        if (!data) { msg('That password is not right. Try again.', true); $('pw').select(); return; }
        if ($('remember').checked) store.set('mmgh.key', tob64(key) + '|' + env.salt);
        unlocked(data);
      } catch (e) { msg('Could not unlock: ' + (e.message || e), true); }
      finally { busy = false; $('unlockBtn').disabled = false; }
    });
  });
})();
</script>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var state = { init: null, req: 0 };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var fmt = {
    n0: function (v) { return v == null ? '–' : Math.round(v).toLocaleString(); },
    n1: function (v) { return v == null ? '–' : v.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 }); },
    n2: function (v) { return v == null ? '–' : v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); },
    usd: function (v) { return v == null ? '–' : '$' + v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); },
    usd0: function (v) { return v == null ? '–' : '$' + Math.round(v).toLocaleString(); },
    pct: function (v) { return v == null ? '–' : (v * 100).toFixed(1) + '%'; }
  };
  var day = function (iso) { if (!iso) return ''; var p = iso.split('-');
    return new Date(+p[0], p[1] - 1, +p[2]).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }); };
  var shortDay = function (iso) { var p = iso.split('-'); return (+p[1]) + '/' + (+p[2]); };

  function call(fn, args, ok) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) {
      $('main').classList.remove('loading');
      $('main').innerHTML = '<div class="status err">Could not load: ' + esc(e && e.message || e) + '</div>';
    });
    r[fn].apply(r, args);
  }
  function saved(k, v) { try { if (v === undefined) return localStorage.getItem('mmov.' + k); localStorage.setItem('mmov.' + k, v); } catch (e) { return null; } }


  // Masks the light sweep to each image's own letters, and pauses the loop when the sidebar is off screen.
  Array.prototype.forEach.call(document.querySelectorAll('.shine'), function (el) {
    var img = el.querySelector('img'); if (!img) return;
    el.style.setProperty('--m', 'url("' + img.src + '")'); el.classList.add('ready');
  });
  if ('IntersectionObserver' in window) {
    var side = document.querySelector('.side');
    new IntersectionObserver(function (es) { side.classList.toggle('paused', !es[0].isIntersecting); }).observe(side);
  }

  call('mmWebInit', [], function (init) {
    state.init = init;
    if (init.env === 'TEST') $('env').innerHTML = '<span class="env">TEST</span>';
    $('tech').innerHTML = init.techs.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('');
    $('period').innerHTML = init.periods.map(function (p) { return '<option>' + esc(p) + '</option>'; }).join('');
    var t = saved('tech'), p = saved('period');
    if (t && init.techs.indexOf(t) !== -1) $('tech').value = t;
    $('period').value = p && init.periods.indexOf(p) !== -1 ? p : 'This Month';
    if (init.latest) { $('from').value = init.latest.slice(0, 8) + '01'; $('to').value = init.latest; }
    ['tech', 'period', 'from', 'to'].forEach(function (id) { $(id).addEventListener('change', load); });
    load();
  });

  function load() {
    var period = $('period').value;
    $('custom').classList.toggle('on', period === 'Custom Range');
    saved('tech', $('tech').value); saved('period', period);
    if (period === 'Custom Range' && (!$('from').value || !$('to').value)) return;
    var id = ++state.req;
    $('main').classList.add('loading');
    call('mmWebReport', [$('tech').value, period, $('from').value, $('to').value], function (r) {
      if (id !== state.req) return;
      $('main').classList.remove('loading');
      render(r);
    });
  }

  function chip(me, team, lowerIsBetter) {
    if (me == null || team == null || !team) return '<span class="chip">&nbsp;</span>';
    var d = me / team - 1;
    if (Math.abs(d) < 0.0005) return '<span class="chip">Even with team</span>';
    var good = lowerIsBetter ? d < 0 : d > 0;
    return '<span class="chip ' + (good ? 'up' : 'down') + '">' + (d > 0 ? '▲ ' : '▼ ') + Math.abs(d * 100).toFixed(1) + '% ' + (d > 0 ? 'above' : 'below') + ' team</span>';
  }
  function spark(vals, color) {
    color = color || '#ff5a5d';
    if (vals.length < 2) return '';
    var max = Math.max.apply(null, vals.concat([0.0001])), W = 120, H = 42;
    var pts = vals.map(function (v, i) { return (i * W / (vals.length - 1)).toFixed(1) + ',' + (H - 3 - (H - 6) * v / max).toFixed(1); });
    var id = 'g' + Math.random().toString(36).slice(2, 7);
    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="' + color + '" stop-opacity=".5"/><stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
      '<polygon fill="url(#' + id + ')" points="0,' + H + ' ' + pts.join(' ') + ' ' + W + ',' + H + '"/>' +
      '<polyline fill="none" stroke="' + color + '" stroke-width="2" vector-effect="non-scaling-stroke" points="' + pts.join(' ') + '"/></svg>';
  }
  function tile(label, me, team, f, sparkVals, hero, sparkColor) {
    return '<div class="card tile' + (hero ? ' hero' : '') + '"><div class="label">' + label + '</div><div class="value">' + f(me) + '</div>' +
      '<div class="cmp">Team avg ' + f(team) + '</div>' + chip(me, team) + (sparkVals ? spark(sparkVals, sparkColor) : '') + '</div>';
  }

  var METRICS = [
    ['Total Sessions', 'sessions', 'n1'], ['Invoiced Sessions', 'invoiced', 'n1'],
    ['Not Billable Sessions', 'notBillable', 'n1', true], ['Work Days', 'workDays', 'n1'],
    ['ADAS Level 1', 'adas1', 'n1'], ['ADAS Level 2', 'adas2', 'n1'], ['ADAS Level 3', 'adas3', 'n1'],
    ['Programming', 'programming', 'n1'], ['SWS', 'sws', 'n1'], ['SAS', 'sas', 'n1'],
    ['All Sensor Learn', 'asl', 'n1'], ['Diagnostic Assist', 'diag', 'n1'],
    ['Additional Service KPI', 'addlKpi', 'n2'], ['Total KPI', 'kpi', 'n2', false, true],
    ['Average KPI per Session', 'avgKpi', 'n2', false, true], ['Total Invoice List Price', 'price', 'usd'],
    ['Avg Invoice per Work Day', 'avgPerDay', 'usd'], ['Avg Invoice per Session', 'avgPerSession', 'usd']
  ];

  function render(r) {
    var p = r.period, me = r.me, tm = r.team;
    $('who').textContent = r.tech;
    $('shown').textContent = (p.start === p.end ? day(p.start) : day(p.start) + ' – ' + day(p.end)) + '  ·  ' +
      r.techsActive + ' technician' + (r.techsActive === 1 ? '' : 's') + ' worked  ·  Data through ' + day(p.latest);
    var h = '';
    if (!me.sessions) h += '<div class="card note" style="margin-top:18px">' + esc(r.tech) + ' has no sessions in this period. Team averages are still shown.</div>';

    var kpiDays = r.trend.map(function (d) { return d.mine; });
    var sesDays = r.trend.map(function (d) { return d.sessions || 0; });
    h += '<div class="grid tiles">' +
      tile('Total KPI', me.kpi, tm.kpi, fmt.n2, kpiDays, true, '#ffd27a') +
      tile('Average KPI per Session', me.avgKpi, tm.avgKpi, fmt.n2) +
      tile('Total Sessions', me.sessions, tm.sessions, fmt.n0, sesDays, false, '#4c9cff') +
      tile('Avg Invoice per Work Day', me.avgPerDay, tm.avgPerDay, fmt.usd0) + '</div>';

    var pre = 0, post = 0, ivs = 0;
    r.share.forEach(function (s) { pre += s.pre; post += s.post; ivs += s.ivs; });
    h += '<div class="grid charts"><div class="card"><div class="head"><h2 id="trendTitle">KPI by Day</h2><div class="legend"><span><i class="key above"></i>' +
      esc(r.tech) + ' above team</span><span><i class="key below"></i>Below team</span><span><i class="key line"></i>Team avg per technician</span></div></div><div class="chart" id="chart"></div></div>' +
      '<div class="card"><div class="head"><h2>Scan Mix</h2><span class="pill">' + esc(p.name) + '</span></div><div class="donut" id="donut"></div>' +
      '<div class="mix"><div><b>' + pre + '</b><span><i class="key" style="background:linear-gradient(135deg,#ff6b5e,#c8102e)"></i>Pre</span></div><div><b>' + post +
      '</b><span><i class="key" style="background:linear-gradient(135deg,#ffd166,#d98a00)"></i>Post</span></div><div><b>' + ivs + '</b><span><i class="key" style="background:linear-gradient(135deg,#7cc0ff,#2f6fe0)"></i>IVS</span></div></div>' +
      '<div class="note">Sessions with no Pre/Post recorded are not in the mix.</div></div></div>';

    var rows = METRICS.map(function (m) {
      var a = me[m[1]], b = tm[m[1]], f = fmt[m[2]];
      var d = (a == null || b == null) ? null : a - b;
      var cls = d == null || Math.abs(d) < 0.005 ? '' : ((m[3] ? d < 0 : d > 0) ? 'up' : 'down');
      return '<tr' + (m[4] ? ' class="strong"' : '') + '><td>' + m[0] + '</td><td>' + f(a) + '</td><td>' + f(b) + '</td><td class="' + cls + '">' +
        (d == null ? '–' : (d > 0 ? '+' : d < 0 ? '−' : '') + f(Math.abs(d))) + '</td><td>' + (a != null && b ? Math.round(a / b * 100) + '%' : '–') + '</td></tr>';
    }).join('');
    h += '<section id="s-compare" class="grid two"><div class="card"><div class="head"><h2>Technician vs Team Average</h2><span class="pill">' + r.techsActive + ' technicians</span></div>' +
      '<div class="scroll"><table><thead><tr><th>Metric</th><th>Tech</th><th>Team Avg</th><th>Diff</th><th>vs Team</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="note">Team Avg = average of the technicians who worked in the period. KPI and invoice per session / per work day are team totals divided. Programming, SWS, SAS, All Sensor Learn and Diagnostic Assist count invoiced sessions only.</div></div>' + '%%RANK%%</section>';

    var maxShare = Math.max.apply(null, r.share.map(function (s) { return s.share || 0; }).concat([0.0001]));
    var tot = r.share.reduce(function (a, s) { a.mine += s.mine; a.available += s.available; a.team += s.team || 0; return a; }, { mine: 0, available: 0, team: 0 });
    h += '<section id="s-makes" class="grid"><div class="card"><div class="head"><h2>Vehicle Make Share</h2><span class="pill">' + fmt.pct(tot.available ? tot.mine / tot.available : null) + ' of all sessions</span></div><div class="scroll"><table><thead><tr><th>Make Group</th><th>Tech</th><th>Available</th><th class="l">Share</th><th>Pre</th><th>Post</th><th>IVS</th><th>Team Avg</th></tr></thead><tbody>' +
      r.share.map(function (s) {
        return '<tr><td>' + esc(s.group) + '</td><td>' + s.mine + '</td><td>' + s.available.toLocaleString() + '</td><td class="l"><span class="sbar" style="width:' +
          Math.max(2, Math.round(56 * (s.share || 0) / maxShare)) + 'px;background:' + heat((s.share || 0) / maxShare) + '"></span>' + fmt.pct(s.share) + '</td><td>' + s.pre + '</td><td>' + s.post + '</td><td>' + s.ivs + '</td><td>' + fmt.n1(s.team) + '</td></tr>';
      }).join('') +
      '<tr class="strong"><td>All Makes</td><td>' + tot.mine + '</td><td>' + tot.available.toLocaleString() + '</td><td class="l">' + fmt.pct(tot.available ? tot.mine / tot.available : null) +
      '</td><td>' + pre + '</td><td>' + post + '</td><td>' + ivs + '</td><td>' + fmt.n1(r.techsActive ? tot.team : null) + '</td></tr></tbody></table></div>' +
      '<div class="note">Available = sessions of that make group imported for the period, all technicians.</div></div></section>';

    var rank = '<div class="card" id="s-rank"><div class="head"><h2>Technician Ranking</h2><span class="pill">by Total KPI · click a name to open</span></div><div class="scroll"><table class="rank"><thead><tr><th>#</th><th class="l">Technician</th><th>Sessions</th><th>Total KPI</th><th>Avg KPI</th><th>Days</th><th>Invoice / Day</th></tr></thead><tbody>' +
      (r.ranking.length ? r.ranking.map(function (x, i) {
        return '<tr data-tech="' + esc(x.tech) + '"' + (x.tech === r.tech ? ' class="me"' : '') + '><td><span class="medal' + (i < 3 ? ' m' + (i + 1) : '') + '">' + (i + 1) + '</span></td><td class="l">' + esc(x.tech) + '</td><td>' + x.sessions + '</td><td>' +
          fmt.n2(x.kpi) + '</td><td>' + fmt.n2(x.avgKpi) + '</td><td>' + x.workDays + '</td><td>' + fmt.usd0(x.avgPerDay) + '</td></tr>';
      }).join('') : '<tr><td colspan="7" class="l">No sessions in this period.</td></tr>') + '</tbody></table></div></div>';
    h = h.split('%%RANK%%').join(rank);

    h += '<section id="s-sessions" class="grid"><div class="card"><div class="head"><h2>Sessions in Period (' + r.sessionsTotal.toLocaleString() + ')</h2>' +
      '<input type="search" id="q" placeholder="Search vehicle, SessionID, status…" aria-label="Search sessions"></div><div class="scroll"><table><thead><tr><th>Date</th><th class="l">SessionID</th><th class="l">Vehicle</th><th class="l">Scan</th><th>ADAS</th><th>KPI</th><th>Invoice List Price</th><th class="l">Status</th></tr></thead><tbody id="sess"></tbody></table></div>' +
      '<div id="more"></div>' + (r.sessionsTotal > r.sessions.length ? '<div class="note">Showing the newest ' + r.sessions.length.toLocaleString() + '. Narrow the period to see older sessions.</div>' : '') + '</div></section>';

    $('main').innerHTML = h;
    chart(r.trend, r.tech);
    donut([[pre, 'url(#dg0)', 'Pre'], [post, 'url(#dg1)', 'Post'], [ivs, 'url(#dg2)', 'IVS']]);
    sessions(r.sessions);
    Array.prototype.forEach.call(document.querySelectorAll('.rank tbody tr[data-tech]'), function (tr) {
      tr.addEventListener('click', function () { $('tech').value = tr.getAttribute('data-tech'); load(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    });
  }

  // Share bars run from deep red (small share) to gold (largest share) so size reads in color as well as length.
  function heat(t) {
    t = Math.max(0, Math.min(1, t));
    var h = Math.round(352 + 46 * t) % 360, l = Math.round(36 + 22 * t), l2 = Math.max(24, l - 16);
    return 'linear-gradient(90deg, hsl(' + h + ' 78% ' + l2 + '%), hsl(' + h + ' 92% ' + l + '%))';
  }

  function donut(parts) {
    var total = parts.reduce(function (a, p) { return a + p[0]; }, 0), R = 70, C = 2 * Math.PI * R, off = 0;
    var n = parts.filter(function (x) { return x[0]; }).length;
    var s = '<svg viewBox="0 0 180 180" role="img" aria-label="Scan mix: ' + parts.map(function (p) { return p[2] + ' ' + p[0]; }).join(', ') + '">' +
      '<defs><linearGradient id="dg0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b5e"/><stop offset="1" stop-color="#c8102e"/></linearGradient>' +
      '<linearGradient id="dg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#d98a00"/></linearGradient>' +
      '<linearGradient id="dg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc0ff"/><stop offset="1" stop-color="#2f6fe0"/></linearGradient>' +
      '<filter id="dsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".55"/></filter></defs>' +
      '<circle cx="90" cy="90" r="' + R + '" fill="none" stroke="var(--card-2)" stroke-width="16"/><g filter="url(#dsh)">';
    if (total) parts.forEach(function (p) {
      if (!p[0]) return;
      var len = C * p[0] / total, gap = n > 1 ? 3 : 0;
      s += '<circle class="seg" cx="90" cy="90" r="' + R + '" fill="none" stroke="' + p[1] + '" stroke-width="16" stroke-dasharray="' +
        Math.max(0, len - gap).toFixed(2) + ' ' + C.toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 90 90)"><title>' + p[2] + ': ' + p[0] +
        ' (' + Math.round(100 * p[0] / total) + '%)</title></circle>';
      off += len;
    });
    s += '</g></svg><div class="mid"><b>' + total.toLocaleString() + '</b><span>Pre / Post / IVS</span></div>';
    $('donut').innerHTML = s;
  }

  function sessions(all) {
    var shown = 200;
    function draw() {
      var q = ($('q').value || '').toLowerCase();
      var list = q ? all.filter(function (s) { return (s.id + ' ' + s.vehicle + ' ' + s.scan + ' ' + s.status + ' ' + s.date).toLowerCase().indexOf(q) !== -1; }) : all;
      $('sess').innerHTML = list.length ? list.slice(0, shown).map(function (s) {
        return '<tr><td>' + shortDay(s.date) + '/' + s.date.slice(0, 4) + '</td><td class="l">' + esc(s.id) + '</td><td class="l">' + esc(s.vehicle) + '</td><td class="l">' + esc(s.scan) +
          '</td><td>' + (s.adas || '') + '</td><td>' + fmt.n2(s.kpi) + '</td><td>' + fmt.usd(s.price) + '</td><td class="l">' + esc(s.status) + '</td></tr>';
      }).join('') : '<tr><td colspan="8" class="l">No sessions.</td></tr>';
      $('more').innerHTML = list.length > shown ? '<button class="more" id="morebtn">Show more (' + (list.length - shown).toLocaleString() + ' left)</button>' : '';
      if ($('morebtn')) $('morebtn').onclick = function () { shown += 500; draw(); };
    }
    $('q').addEventListener('input', function () { shown = 200; draw(); });
    draw();
  }

  // Bars = technician KPI per day (red gradient); dashed line = team average per technician.
  function chart(trend, techName) {
    var box = $('chart'), pts = trend, weekly = false;
    if (pts.length > 45) {
      weekly = true;
      var wk = {}, order = [];
      pts.forEach(function (d) {
        var p = d.date.split('-'), dt = new Date(Date.UTC(+p[0], p[1] - 1, +p[2]));
        dt.setUTCDate(dt.getUTCDate() - (dt.getUTCDay() + 6) % 7);
        var k = dt.toISOString().slice(0, 10);
        if (!wk[k]) { wk[k] = { date: k, mine: 0, team: 0, sessions: 0 }; order.push(k); }
        wk[k].mine += d.mine; wk[k].team += d.team; wk[k].sessions += d.sessions || 0;
      });
      pts = order.map(function (k) { return wk[k]; });
      $('trendTitle').textContent = 'KPI by Week';
    }
    if (!pts.length) { box.innerHTML = '<div class="status">No sessions in this period.</div>'; return; }
    var W = Math.max(320, box.clientWidth || 600), H = 260, L = 40, R = 10, T = 14, B = 28;
    var max = Math.max.apply(null, pts.map(function (d) { return Math.max(d.mine, d.team); }).concat([1]));
    var raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), st = [1, 2, 2.5, 5, 10].filter(function (m) { return m * mag >= raw; })[0] * mag, nice = st * 4;
    var band = (W - L - R) / pts.length, bw = Math.max(2, Math.min(26, band * 0.62));
    var cx = function (i) { return L + band * (i + 0.5); };
    var y = function (v) { return T + (H - T - B) * (1 - v / nice); };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="KPI by ' + (weekly ? 'week' : 'day') + ', ' + esc(techName) + ' versus team average">' +
      '<defs><linearGradient id="barUp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset=".45" stop-color="#f0302f"/><stop offset="1" stop-color="#8f0d1a"/></linearGradient>' +
      '<linearGradient id="barDn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a3242c"/><stop offset="1" stop-color="#3f060c"/></linearGradient>' +
      '<linearGradient id="chartBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3dd6c6" stop-opacity=".05"/><stop offset="1" stop-color="#3dd6c6" stop-opacity="0"/></linearGradient></defs>' +
      '<rect x="' + L + '" y="' + T + '" width="' + (W - L - R) + '" height="' + (H - T - B) + '" fill="url(#chartBg)"/>';
    for (var g = 0; g <= 4; g++) {
      var v = nice * g / 4, yy = y(v);
      s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(' + (g ? '--grid' : '--axis') + ')" stroke-width="1"/>' +
        '<text x="' + (L - 8) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + (Math.round(v * 10) / 10) + '</text>';
    }
    pts.forEach(function (d, i) {
      if (!d.mine) return;
      var x0 = cx(i) - bw / 2, y0 = y(d.mine), hgt = y(0) - y0, r = Math.min(4, bw / 2, hgt);
      s += '<path class="bar" style="animation-delay:' + Math.min(300, i * 12) + 'ms" fill="url(#' + (d.mine >= d.team ? 'barUp' : 'barDn') + ')" d="M' + x0 + ',' + y(0) + 'V' + (y0 + r) + 'Q' + x0 + ',' + y0 + ' ' + (x0 + r) + ',' + y0 + 'H' + (x0 + bw - r) + 'Q' + (x0 + bw) + ',' + y0 + ' ' + (x0 + bw) + ',' + (y0 + r) + 'V' + y(0) + 'Z"/>';
    });
    var every = Math.ceil(pts.length / 8);
    pts.forEach(function (d, i) { if (i % every === 0 || i === pts.length - 1) s += '<text x="' + cx(i) + '" y="' + (H - 9) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + shortDay(d.date) + '</text>'; });
    s += '<g class="teamline"><polyline fill="none" stroke="var(--team)" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" points="' +
      pts.map(function (d, i) { return cx(i).toFixed(1) + ',' + y(d.team).toFixed(1); }).join(' ') + '"/>' +
      (pts.length <= 31 ? pts.map(function (d, i) { return '<circle cx="' + cx(i).toFixed(1) + '" cy="' + y(d.team).toFixed(1) + '" r="2.5" fill="var(--team)" stroke="var(--card)" stroke-width="1.5"/>'; }).join('') : '') + '</g>';
    s += '<rect id="hl" y="' + T + '" height="' + (H - T - B) + '" fill="rgba(255,255,255,0.05)" visibility="hidden"/></svg><div class="tip" id="tip"></div>';
    box.innerHTML = s;
    var svg = box.querySelector('svg'), tip = $('tip'), hl = $('hl');
    hl.setAttribute('width', band);
    svg.addEventListener('mousemove', function (ev) {
      var rc = svg.getBoundingClientRect(), px = (ev.clientX - rc.left) * W / rc.width;
      var i = Math.max(0, Math.min(pts.length - 1, Math.floor((px - L) / band))), d = pts[i];
      hl.setAttribute('x', L + band * i); hl.setAttribute('visibility', 'visible');
      tip.innerHTML = '<b>' + (weekly ? 'Week of ' : '') + day(d.date) + '</b><br><i class="key ' + (d.mine >= d.team ? 'above' : 'below') + '"></i>' + esc(techName) + ': ' + fmt.n2(d.mine) +
        ' KPI · ' + (d.sessions || 0) + ' sessions<br><i class="key line"></i>Team avg: ' + fmt.n2(d.team) + ' KPI';
      tip.style.display = 'block';
      var left = cx(i) * rc.width / W + 14;
      if (left + tip.offsetWidth > rc.width) left = cx(i) * rc.width / W - tip.offsetWidth - 14;
      tip.style.left = Math.max(0, left) + 'px'; tip.style.top = '6px';
    });
    svg.addEventListener('mouseleave', function () { tip.style.display = 'none'; hl.setAttribute('visibility', 'hidden'); });
  }
})();
</script>
</body>
</html>
